name: Export SPAs and inject into blog

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  export-spas:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout blog repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Checkout SPAs repo
        uses: actions/checkout@v4
        with:
          repository: thefourtheye/spas
          path: spas
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: spas/package-lock.json
      - name: Build & export SPAs
        working-directory: ./spas
        run: |
          npm ci
          TARGET="${{ github.workspace }}/static/spas" BLOG_DIR="${{ github.workspace }}" BASE="/spas/" npm run export-and-inject
      - name: Commit exported SPAs back to blog repo (if any changes)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A static/spas
          if git diff --cached --quiet; then
            echo "No SPA changes to commit"
          else
            git commit -m "chore(spas): update exported SPAs [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
